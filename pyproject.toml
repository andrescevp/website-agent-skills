[project]
name = "website-auditor-skills"
version = "0.1.0"
description = "Specialized agent skills and tooling to audit websites for SEO, GEO, and Lighthouse metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "beautifulsoup4>=4.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
